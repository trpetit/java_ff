spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.threads.virtual.enabled=true

logging.level.sql=DEBUG
# Uncomment to see query arguments
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

security.allowedOrigins=http://localhost:3000,http://localhost:3001,http://localhost:4173
server.servlet.context-path=/api
# Load only the first data.sql on the classpath: the seed data in the app, src/test/resources/data.sql in tests
spring.sql.init.data-locations=classpath:data.sql
